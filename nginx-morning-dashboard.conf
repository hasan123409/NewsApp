server {
    listen 8089;
    listen [::]:8089;
    server_name _;

    root /var/www/morning-dashboard;
    index index.html;

    # Performance & Caching
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Do not cache index.html so the 9:00 AM edition updates immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/morning-dashboard.access.log;
    error_log /var/log/nginx/morning-dashboard.error.log;
}
