name: Deploy to GitHub Pages

on:
  schedule:
    # Runs every hour on the hour
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Live Intel & Build Dashboard
        run: |
          mkdir -p ./public
          python fetch_and_build.py -o ./public/index.html --city "Mumbai" --lat 19.0760 --lon 72.8777
          if [ -f manifest.json ]; then cp manifest.json ./public/; fi
          if [ -f profile.html ]; then cp profile.html ./public/; fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
